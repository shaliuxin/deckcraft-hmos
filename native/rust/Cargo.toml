[package]
name = "deckcraft-hmos"
version = "0.17.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "deckcraft_hmos"
crate-type = ["staticlib"]

[dependencies]
# 上游前端、引擎、字体库：path 依赖。`SlideApp` 原生暴露宿主缝
# new(Session, Services) / logic(ctx) / raw_input_hook(ctx, raw) / ui(ui) / run(id, params)，
# 无需 patch 上游 UI / 引擎。唯一的例外是 `crates/model/src/lib.rs` 的占位符提示钩子，
# 由 scripts/apply_model_prompt_i18n.py 幂等注入（见 README「中文界面」章节）。
deckcraft-ui-egui = { path = "../../../deckcraft/crates/ui-egui" }
deckcraft-engine = { path = "../../../deckcraft/crates/engine" }
deckcraft-fonts = { path = "../../../deckcraft/crates/fonts" }
deckcraft-model = { path = "../../../deckcraft/crates/model" }
# egui 0.37 / egui-wgpu 0.37：与 deckcraft 根 Cargo.toml 的 [patch] 同一 git fork rev，
# 否则跨边界 egui 类型全对不上（PhotoCraft / WordCraft 的既有教训）。
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37" }
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没有渲染后端。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"

# [patch] 只对 workspace 根生效；本适配层是独立 workspace，必须把上游根 Cargo.toml 的
# [patch.crates-io] 整段抄过来，再叠加 wgpu-hal 的鸿蒙 GLES 修补（30.0.1）。
# 上游根 Cargo.toml（commit c4674f24）的 patch 段：krilla + egui 全家桶 + winit。
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.8.2" }
ecolor = { path = "../../third_party/egui-6d518fc/crates/ecolor" }
emath = { path = "../../third_party/egui-6d518fc/crates/emath" }
epaint = { path = "../../third_party/egui-6d518fc/crates/epaint" }
epaint_default_fonts = { path = "../../third_party/egui-6d518fc/crates/epaint_default_fonts" }
egui = { path = "../../third_party/egui-6d518fc/crates/egui" }
egui-winit = { path = "../../third_party/egui-6d518fc/crates/egui-winit" }
egui-wgpu = { path = "../../third_party/egui-6d518fc/crates/egui-wgpu" }
egui_glow = { path = "../../third_party/egui-6d518fc/crates/egui_glow" }
egui_extras = { path = "../../third_party/egui-6d518fc/crates/egui_extras" }
egui_kittest = { path = "../../third_party/egui-6d518fc/crates/egui_kittest" }
egui_system_font_provider = { path = "../../third_party/egui-6d518fc/crates/egui_system_font_provider" }
eframe = { path = "../../third_party/egui-6d518fc/crates/eframe" }
egui_demo_lib = { path = "../../third_party/egui-6d518fc/crates/egui_demo_lib" }
egui_inspection = { path = "../../third_party/egui-6d518fc/crates/egui_inspection" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# wgpu-hal：鸿蒙 GLES 需 uniform-block 修补；目录不存在即报错，不允许悄悄回退旧版。
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = 0

[workspace]
